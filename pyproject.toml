[project]
name = "binpat"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pyyaml",
    "biopython",
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "requests",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
gpu = [
    "torch",
    "torchvision",
    "torchaudio",
    "fair-esm",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

